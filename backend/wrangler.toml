name = "hendy-master-worker"
main = "src/index.js"
compatibility_date = "2024-03-20"
node_compat = true

# Cấu hình biến môi trường
[vars]
ADMIN_ID = "6138197737"
INTERNAL_SECRET = "hendy_secret_key_2026"
# LƯU Ý: Không ghi BOT_TOKEN ở đây. Hãy lưu vào CF Secrets để bảo mật.

# Khai báo Cloudflare KV (Thay thế cho database.json)
[[kv_namespaces]]
binding = "HENDY_DB"
id = "THAY_BANG_ID_KV_CUA_BAN" # Tạo bằng lệnh: npx wrangler kv:namespace create HENDY_DB

# Kích hoạt Puppeteer (Browser Rendering)
[browser]
binding = "MYBROWSER"

# Cấu hình Cron Trigger để AI Engine chạy mỗi phút (Thay thế cho setInterval)
[triggers]
crons = ["* * * * *"]
